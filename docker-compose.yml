services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Chạy thử image production ở local (F19.2): docker compose --profile app up --build
  # → http://localhost:8080. Migrate/seed DB trước bằng lệnh prisma ở máy (CLAUDE.md).
  app:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgresql://meridian:meridian@db:5432/meridian
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
